<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATS - Faculty Academic Tracking System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { font-family: 'Prompt', sans-serif; }
  .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); }
  .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  .card-hover { transition: all 0.3s; }
  .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
  .fade-in { animation: fadeIn 0.5s; }
  @keyframes fadeIn { from {opacity:0;transform:translateY(10px);} to {opacity:1;transform:translateY(0);} }
  .sidebar-item { transition: all 0.2s; }
  .sidebar-item:hover, .sidebar-item.active { background: rgba(255,255,255,0.2); border-left: 4px solid #fff; }
  .chat-bubble { max-width: 80%; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #667eea; border-radius: 4px; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ===== LOGIN PAGE ===== -->
<div id="loginPage" class="min-h-screen gradient-bg flex items-center justify-center p-4">
  <div class="glass rounded-3xl shadow-2xl p-8 w-full max-w-md fade-in">
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg">
        <i class="fas fa-graduation-cap text-white text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">FATS</h1>
      <p class="text-gray-600 text-sm">ระบบฐานข้อมูลอาจารย์ภาควิชา<br>เทคโนโลยีและสื่อสารการศึกษา</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-sm font-medium text-gray-700">ชื่อผู้ใช้</label>
        <div class="relative mt-1">
          <i class="fas fa-user absolute left-3 top-3.5 text-gray-400"></i>
          <input id="loginUser" type="text" class="w-full pl-10 pr-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="admin">
        </div>
      </div>
      <div>
        <label class="text-sm font-medium text-gray-700">รหัสผ่าน</label>
        <div class="relative mt-1">
          <i class="fas fa-lock absolute left-3 top-3.5 text-gray-400"></i>
          <input id="loginPass" type="password" class="w-full pl-10 pr-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••">
        </div>
      </div>
      <button onclick="doLogin()" class="w-full py-3 gradient-bg text-white font-semibold rounded-xl hover:opacity-90 shadow-lg">
        <i class="fas fa-sign-in-alt mr-2"></i>เข้าสู่ระบบ
      </button>
      <div id="loginMsg" class="text-center text-sm"></div>
      <div class="text-center text-xs text-gray-500 mt-4">
        <i class="fas fa-info-circle"></i> Demo: admin / admin123
      </div>
    </div>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="mainApp" class="hidden">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 gradient-bg text-white z-40 shadow-2xl">
    <div class="p-6 border-b border-white/20">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
          <i class="fas fa-graduation-cap text-xl"></i>
        </div>
        <div>
          <h2 class="font-bold">FATS</h2>
          <p class="text-xs opacity-80">Faculty Tracking</p>
        </div>
      </div>
    </div>
    <nav class="p-4 space-y-1" id="navMenu"></nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-white/20">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
          <i class="fas fa-user"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-medium text-sm truncate" id="userName">-</p>
          <p class="text-xs opacity-80" id="userRole">-</p>
        </div>
      </div>
      <button onclick="doLogout()" class="w-full py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm">
        <i class="fas fa-sign-out-alt mr-2"></i>ออกจากระบบ
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 p-8">
    <!-- Top Bar -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold text-gray-800" id="pageTitle">แดชบอร์ด</h1>
        <p class="text-gray-500 text-sm" id="pageSubtitle">ภาพรวมข้อมูลภาควิชา</p>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative">
          <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
          <input id="globalSearch" type="text" placeholder="ค้นหา..." 
                 class="pl-10 pr-4 py-2 w-64 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button class="w-10 h-10 bg-white rounded-xl shadow flex items-center justify-center hover:shadow-lg">
          <i class="fas fa-bell text-gray-600"></i>
        </button>
      </div>
    </div>

    <!-- Page Container -->
    <div id="pageContent"></div>
  </main>

  <!-- AI Chat Button -->
  <button onclick="toggleAI()" class="fixed bottom-6 right-6 w-16 h-16 gradient-bg rounded-full shadow-2xl text-white text-2xl hover:scale-110 transition z-50">
    <i class="fas fa-robot"></i>
  </button>

  <!-- AI Chat Panel -->
  <div id="aiPanel" class="hidden fixed bottom-24 right-6 w-96 h-[500px] bg-white rounded-2xl shadow-2xl z-50 flex flex-col">
    <div class="gradient-bg text-white p-4 rounded-t-2xl flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fas fa-robot text-xl"></i>
        <div>
          <p class="font-semibold">AI Assistant</p>
          <p class="text-xs opacity-80">ผู้ช่วยอัจฉริยะ</p>
        </div>
      </div>
      <button onclick="toggleAI()" class="hover:bg-white/20 w-8 h-8 rounded-lg"><i class="fas fa-times"></i></button>
    </div>
    <div id="aiChat" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50"></div>
    <div class="p-3 border-t flex gap-2">
      <input id="aiInput" type="text" placeholder="ถามอะไรก็ได้..." 
             class="flex-1 px-3 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
             onkeypress="if(event.key==='Enter')sendAI()">
      <button onclick="sendAI()" class="px-4 gradient-bg text-white rounded-xl"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="p-6 border-b flex justify-between items-center sticky top-0 bg-white">
      <h3 id="modalTitle" class="text-xl font-bold">Modal</h3>
      <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100"><i class="fas fa-times"></i></button>
    </div>
    <div id="modalBody" class="p-6"></div>
  </div>
</div>

<script>
// ===== State =====
let currentUser = null;
let currentPage = 'dashboard';
let dashboardData = null;

// ===== Menu based on Role =====
const menus = {
  super_admin: [
    { id: 'dashboard', icon: 'fa-chart-line', label: 'แดชบอร์ด' },
    { id: 'teachers', icon: 'fa-chalkboard-teacher', label: 'อาจารย์' },
    { id: 'teaching', icon: 'fa-book', label: 'ภาระงานสอน' },
    { id: 'publications', icon: 'fa-file-alt', label: 'ผลงานวิชาการ' },
    { id: 'scopus', icon: 'fa-globe', label: 'Scopus/ISI' },
    { id: 'research', icon: 'fa-flask', label: 'โครงการวิจัย' },
    { id: 'service', icon: 'fa-hands-helping', label: 'บริการวิชาการ' },
    { id: 'users', icon: 'fa-users-cog', label: 'จัดการผู้ใช้' },
    { id: 'settings', icon: 'fa-cog', label: 'ตั้งค่าระบบ' }
  ],
  head_dept: [
    { id: 'dashboard', icon: 'fa-chart-line', label: 'แดชบอร์ด' },
    { id: 'teachers', icon: 'fa-chalkboard-teacher', label: 'อาจารย์' },
    { id: 'publications', icon: 'fa-file-alt', label: 'ผลงานวิชาการ' },
    { id: 'research', icon: 'fa-flask', label: 'โครงการวิจัย' },
    { id: 'approve', icon: 'fa-check-circle', label: 'อนุมัติผลงาน' }
  ],
  qa_officer: [
    { id: 'dashboard', icon: 'fa-chart-line', label: 'แดชบอร์ด' },
    { id: 'teachers', icon: 'fa-chalkboard-teacher', label: 'อาจารย์' },
    { id: 'reports', icon: 'fa-file-export', label: 'รายงาน' }
  ],
  teacher: [
    { id: 'dashboard', icon: 'fa-chart-line', label: 'แดชบอร์ดของฉัน' },
    { id: 'myprofile', icon: 'fa-user', label: 'ข้อมูลส่วนตัว' },
    { id: 'mypubs', icon: 'fa-file-alt', label: 'ผลงานของฉัน' },
    { id: 'teachers', icon: 'fa-users', label: 'รายชื่ออาจารย์' }
  ]
};

// ===== Login =====
function doLogin() {
  const u = document.getElementById('loginUser').value;
  const p = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMsg');
  msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังเข้าสู่ระบบ...';
  
  google.script.run
    .withSuccessHandler(res => {
      if (res.success) {
        currentUser = res.user;
        sessionStorage.setItem('fats_user', JSON.stringify(currentUser));
        showApp();
      } else {
        msg.innerHTML = `<span class="text-red-600"><i class="fas fa-exclamation-circle"></i> ${res.message}</span>`;
      }
    })
    .withFailureHandler(err => {
      msg.innerHTML = `<span class="text-red-600">Error: ${err.message}</span>`;
    })
    .login(u, p);
}

function doLogout() {
  sessionStorage.removeItem('fats_user');
  location.reload();
}

// ===== Show App =====
function showApp() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userRole').textContent = roleLabel(currentUser.role);
  renderMenu();
  navigate('dashboard');
}

function roleLabel(r) {
  return { super_admin: 'ผู้ดูแลระบบ', head_dept: 'หัวหน้าภาควิชา', qa_officer: 'เจ้าหน้าที่ QA', teacher: 'อาจารย์' }[r] || r;
}

function renderMenu() {
  const items = menus[currentUser.role] || [];
  document.getElementById('navMenu').innerHTML = items.map(m => `
    <button onclick="navigate('${m.id}')" id="nav-${m.id}" 
            class="sidebar-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 text-sm">
      <i class="fas ${m.icon} w-5"></i><span>${m.label}</span>
    </button>
  `).join('');
}

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById(`nav-${page}`);
  if (nav) nav.classList.add('active');
  
  const titles = {
    dashboard: ['แดชบอร์ด', 'ภาพรวมข้อมูลภาควิชา'],
    teachers: ['รายชื่ออาจารย์', 'จัดการข้อมูลอาจารย์'],
    teaching: ['ภาระงานสอน', 'หน่วยกิตและการสอน'],
    publications: ['ผลงานวิชาการ', 'รายการผลงานทั้งหมด'],
    scopus: ['Scopus / ISI', 'ดัชนีวารสารนานาชาติ'],
    research: ['โครงการวิจัย', 'รายการโครงการวิจัย'],
    service: ['บริการวิชาการ', 'การบริการวิชาการสู่สังคม'],
    users: ['จัดการผู้ใช้', 'ผู้ใช้งานและสิทธิ์'],
    settings: ['ตั้งค่าระบบ', 'การตั้งค่าทั่วไป'],
    approve: ['อนุมัติผลงาน', 'รอการอนุมัติ'],
    reports: ['รายงาน', 'รายงานสรุป'],
    myprofile: ['ข้อมูลของฉัน', 'ข้อมูลส่วนตัว'],
    mypubs: ['ผลงานของฉัน', 'จัดการผลงานส่วนตัว']
  };
  document.getElementById('pageTitle').textContent = titles[page]?.[0] || page;
  document.getElementById('pageSubtitle').textContent = titles[page]?.[1] || '';
  
  const renderer = {
    dashboard: renderDashboard,
    teachers: () => renderList('อาจารย์', 'teacher_id'),
    teaching: () => renderList('ภาระงานสอน', 'work_id'),
    publications: () => renderList('ผลงานวิชาการ', 'pub_id'),
    scopus: () => renderList('Scopus_ISI', 'scopus_id'),
    research: () => renderList('โครงการวิจัย', 'research_id'),
    service: () => renderList('บริการวิชาการ', 'service_id'),
    users: renderUsers,
    settings: renderSettings,
    approve: renderApprove,
    reports: renderReports,
    myprofile: renderMyProfile,
    mypubs: renderMyPubs
  };
  (renderer[page] || renderDashboard)();
}

// ===== Dashboard =====
function renderDashboard() {
  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="text-center py-20"><i class="fas fa-spinner fa-spin text-4xl text-indigo-500"></i></div>';
  
  google.script.run.withSuccessHandler(res => {
    if (!res.success) { content.innerHTML = `<p class="text-red-500">${res.message}</p>`; return; }
    dashboardData = res;
    const s = res.summary;
    
    let teacherData = res.teachers;
    if (currentUser.role === 'teacher') {
      teacherData = teacherData.filter(t => t.teacher_id === currentUser.teacher_id);
    }
    
    content.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 fade-in">
        ${statCard('fa-chalkboard-teacher', 'อาจารย์', s.totalTeachers, 'from-blue-500 to-cyan-500')}
        ${statCard('fa-file-alt', 'ผลงานวิชาการ', s.totalPublications, 'from-purple-500 to-pink-500')}
        ${statCard('fa-flask', 'โครงการวิจัย', s.totalResearch, 'from-orange-500 to-red-500')}
        ${statCard('fa-hands-helping', 'บริการวิชาการ', s.totalServices, 'from-green-500 to-emerald-500')}
      </div>
      
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        <div class="bg-white rounded-2xl shadow p-6 card-hover">
          <h3 class="font-bold text-lg mb-4"><i class="fas fa-chart-bar text-indigo-500 mr-2"></i>ผลงานรายปี</h3>
          <canvas id="chartYear" height="200"></canvas>
        </div>
        <div class="bg-white rounded-2xl shadow p-6 card-hover">
          <h3 class="font-bold text-lg mb-4"><i class="fas fa-chart-pie text-purple-500 mr-2"></i>ประเภทผลงาน</h3>
          <canvas id="chartType" height="200"></canvas>
        </div>
      </div>
      
      <div class="bg-white rounded-2xl shadow p-6 card-hover">
        <h3 class="font-bold text-lg mb-4"><i class="fas fa-list text-indigo-500 mr-2"></i>อาจารย์และภาระงาน</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50">
              <tr>
                <th class="p-3 text-left">รหัส</th>
                <th class="p-3 text-left">ชื่อ-นามสกุล</th>
                <th class="p-3 text-left">ตำแหน่ง</th>
                <th class="p-3 text-center">หน่วยกิต</th>
                <th class="p-3 text-center">ผลงาน</th>
                <th class="p-3 text-center">วิจัย</th>
              </tr>
            </thead>
            <tbody>
              ${teacherData.slice(0, 10).map(t => `
                <tr class="border-b hover:bg-gray-50">
                  <td class="p-3">${t.code || t.teacher_id}</td>
                  <td class="p-3 font-medium">${t.prefix}${t.firstname} ${t.lastname}</td>
                  <td class="p-3">${t.academic_level || '-'}</td>
                  <td class="p-3 text-center"><span class="px-2 py-1 bg-blue-100 text-blue-700 rounded-full text-xs">${t.teachingCredits}</span></td>
                  <td class="p-3 text-center">${t.pubCount}</td>
                  <td class="p-3 text-center">${t.researchCount}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
    
    // Charts
    const years = Object.keys(res.publicationsByYear);
    new Chart(document.getElementById('chartYear'), {
      type: 'bar',
      data: {
        labels: years,
        datasets: [{
          label: 'ผลงาน',
          data: years.map(y => res.publicationsByYear[y]),
          backgroundColor: 'rgba(102,126,234,0.8)',
          borderRadius: 8
        }]
      },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });
    
    const types = Object.keys(res.publicationTypes);
    new Chart(document.getElementById('chartType'), {
      type: 'doughnut',
      data: {
        labels: types,
        datasets: [{
          data: types.map(t => res.publicationTypes[t]),
          backgroundColor: ['#667eea','#764ba2','#f093fb','#4facfe','#43e97b','#fa709a','#fed330']
        }]
      },
      options: { responsive: true }
    });
  }).getDashboardData();
}

function statCard(icon, label, value, gradient) {
  return `
    <div class="bg-gradient-to-br ${gradient} rounded-2xl p-6 text-white shadow-lg card-hover">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-white/80 text-sm">${label}</p>
          <p class="text-3xl font-bold mt-2">${value}</p>
        </div>
        <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
          <i class="fas ${icon} text-xl"></i>
        </div>
      </div>
    </div>
  `;
}

// ===== Generic List Renderer =====
function renderList(sheetName, idField) {
  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="text-center py-20"><i class="fas fa-spinner fa-spin text-4xl text-indigo-500"></i></div>';
  
  const canEdit = ['super_admin','head_dept'].includes(currentUser.role);
  
  google.script.run.withSuccessHandler(res => {
    if (!res.success) { content.innerHTML = `<p class="text-red-500">${res.message}</p>`; return; }
    const data = res.data;
    
    if (data.length === 0) {
      content.innerHTML = `<div class="bg-white rounded-2xl shadow p-12 text-center">
        <i class="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
        <p class="text-gray-500">ยังไม่มีข้อมูล</p></div>`;
      return;
    }
    
    const headers = Object.keys(data[0]);
    content.innerHTML = `
      <div class="bg-white rounded-2xl shadow overflow-hidden">
        <div class="p-4 border-b flex justify-between items-center">
          <input type="text" id="tableSearch" placeholder="ค้นหาในตาราง..." 
                 onkeyup="filterTable()" class="px-4 py-2 border rounded-xl w-64 outline-none focus:ring-2 focus:ring-indigo-500">
          ${canEdit ? `<button onclick="openAddForm('${sheetName}','${idField}')" 
                 class="px-4 py-2 gradient-bg text-white rounded-xl"><i class="fas fa-plus mr-2"></i>เพิ่มข้อมูล</button>` : ''}
        </div>
        <div class="overflow-x-auto">
          <table id="dataTable" class="w-full text-sm">
            <thead class="bg-gray-50">
              <tr>${headers.map(h => `<th class="p-3 text-left font-semibold">${h}</th>`).join('')}
              ${canEdit ? '<th class="p-3 text-center">จัดการ</th>' : ''}</tr>
            </thead>
            <tbody>
              ${data.map(row => `
                <tr class="border-b hover:bg-gray-50" data-row='${JSON.stringify(row).replace(/'/g,"&#39;")}'>
                  ${headers.map(h => `<td class="p-3">${row[h] ?? ''}</td>`).join('')}
                  ${canEdit ? `<td class="p-3 text-center">
                    <button onclick='editRow("${sheetName}","${idField}",${JSON.stringify(row).replace(/"/g,"&quot;")})' 
                            class="text-blue-600 hover:bg-blue-50 px-2 py-1 rounded"><i class="fas fa-edit"></i></button>
                    <button onclick='deleteRow("${sheetName}","${idField}","${row[idField]}")' 
                            class="text-red-600 hover:bg-red-50 px-2 py-1 rounded"><i class="fas fa-trash"></i></button>
                  </td>` : ''}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }).getAllData(sheetName);
}

function filterTable() {
  const q = document.getElementById('tableSearch').value.toLowerCase();
  document.querySelectorAll('#dataTable tbody tr').forEach(tr => {
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function openAddForm(sheet, idField) {
  google.script.run.withSuccessHandler(res => {
    if (!res.success) return;
    const headers = Object.keys(res.data[0] || {});
    showModal(`เพิ่มข้อมูล - ${sheet}`, buildForm(headers, {}), () => {
      const data = {};
      headers.forEach(h => data[h] = document.getElementById(`f_${h}`).value);
      google.script.run.withSuccessHandler(r => {
        if (r.success) { closeModal(); navigate(currentPage); toast(r.message, 'success'); }
        else toast(r.message, 'error');
      }).addData(sheet, data);
    });
  }).getAllData(sheet);
}

function editRow(sheet, idField, row) {
  const headers = Object.keys(row);
  showModal(`แก้ไขข้อมูล - ${sheet}`, buildForm(headers, row), () => {
    const data = {};
    headers.forEach(h => data[h] = document.getElementById(`f_${h}`).value);
    google.script.run.withSuccessHandler(r => {
      if (r.success) { closeModal(); navigate(currentPage); toast(r.message, 'success'); }
      else toast(r.message, 'error');
    }).updateData(sheet, idField, row[idField], data);
  });
}

function deleteRow(sheet, idField, id) {
  if (!confirm('ยืนยันการลบ?')) return;
  google.script.run.withSuccessHandler(r => {
    if (r.success) { navigate(currentPage); toast(r.message, 'success'); }
    else toast(r.message, 'error');
  }).deleteData(sheet, idField, id);
}

function buildForm(headers, data) {
  return `<div class="space-y-3">${headers.map(h => `
    <div>
      <label class="text-sm font-medium text-gray-700">${h}</label>
      <input id="f_${h}" value="${data[h] ?? ''}" class="w-full mt-1 px-3 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
    </div>`).join('')}</div>`;
}

// ===== Modal =====
let modalCallback = null;
function showModal(title, bodyHtml, onSave) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml + `
    <div class="flex justify-end gap-2 mt-6">
      <button onclick="closeModal()" class="px-4 py-2 border rounded-xl">ยกเลิก</button>
      <button onclick="modalSave()" class="px-4 py-2 gradient-bg text-white rounded-xl">บันทึก</button>
    </div>`;
  modalCallback = onSave;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function modalSave() { if (modalCallback) modalCallback(); }

// ===== Toast =====
function toast(msg, type='info') {
  const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500' };
  const t = document.createElement('div');
  t.className = `fixed top-6 right-6 ${colors[type]} text-white px-6 py-3 rounded-xl shadow-2xl z-50 fade-in`;
  t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'} mr-2"></i>${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ===== AI Assistant =====
function toggleAI() {
  const p = document.getElementById('aiPanel');
  p.classList.toggle('hidden');
  if (!p.classList.contains('hidden') && document.getElementById('aiChat').children.length === 0) {
    addAIMessage('ai', 'สวัสดีค่ะ! ฉันคือ AI Assistant ของ FATS สามารถถามเกี่ยวกับอาจารย์ ผลงานวิชาการ หรือโครงการวิจัยได้ค่ะ 🎓');
  }
}

function addAIMessage(who, text) {
  const chat = document.getElementById('aiChat');
  const bubble = document.createElement('div');
  bubble.className = `chat-bubble ${who==='user' ? 'ml-auto bg-indigo-500 text-white' : 'bg-white border'} rounded-2xl p-3 shadow`;
  bubble.innerHTML = text.replace(/\n/g, '<br>');
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
}

function sendAI() {
  const input = document.getElementById('aiInput');
  const q = input.value.trim();
  if (!q) return;
  addAIMessage('user', q);
  input.value = '';
  addAIMessage('ai', '<i class="fas fa-spinner fa-spin"></i> กำลังคิด...');
  
  google.script.run.withSuccessHandler(res => {
    document.getElementById('aiChat').lastChild.remove();
    addAIMessage('ai', res.answer);
  }).askAI(q);
}

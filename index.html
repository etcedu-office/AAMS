<!-- index.html -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Academic Tracking System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-40">
    <h1 class="text-xl font-bold text-blue-600">EDTECH Tracking System</h1>
    <div id="auth-section">
      <button onclick="openLoginModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">เข้าสู่ระบบ</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mx-auto p-6">
    <!-- Public Dashboard -->
    <section id="public-dashboard" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
        <p class="text-gray-500">อาจารย์ทั้งหมด</p>
        <p id="stat-profs" class="text-3xl font-bold">0</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
        <p class="text-gray-500">ผลงานวิชาการ</p>
        <p id="stat-pubs" class="text-3xl font-bold">0</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-purple-500">
        <p class="text-gray-500">Scopus/ISI</p>
        <p id="stat-scopus" class="text-3xl font-bold">0</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-orange-500">
        <p class="text-gray-500">หน่วยกิตรวม (เทอมนี้)</p>
        <p id="stat-credits" class="text-3xl font-bold">0</p>
      </div>
    </section>

    <!-- Search Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm mb-8 flex gap-4">
      <input type="text" id="search-input" placeholder="ค้นหาชื่ออาจารย์, ผลงาน, หรือรายวิชา..." class="flex-1 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
      <button onclick="searchData()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">ค้นหา</button>
    </div>

    <!-- Data Table Area (Dynamic) -->
    <div id="data-table-area" class="bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-xl font-bold mb-4">ข้อมูลอาจารย์และภาระงาน</h2>
      <div id="table-content" class="overflow-x-auto">กำลังโหลดข้อมูล...</div>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-xl w-96">
      <h2 class="text-2xl font-bold mb-4">เข้าสู่ระบบ</h2>
      <input type="email" id="login-email" placeholder="Email" class="w-full border p-2 rounded mb-3">
      <input type="password" id="login-pass" placeholder="Password" class="w-full border p-2 rounded mb-4">
      <button onclick="doLogin()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Login</button>
      <button onclick="closeLoginModal()" class="w-full mt-2 text-gray-500">ยกเลิก</button>
    </div>
  </div>

  <!-- AI Assistant Floating Button -->
  <button onclick="toggleAI()" class="fixed bottom-6 right-6 bg-blue-600 text-white p-4 rounded-full shadow-lg hover:scale-110 transition-transform z-50">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
  </button>

  <!-- AI Chat Panel -->
  <div id="ai-panel" class="hidden fixed bottom-24 right-6 w-80 h-96 bg-white rounded-xl shadow-2xl flex flex-col z-50 border">
    <div class="bg-blue-600 text-white p-3 rounded-t-xl font-bold">AI Assistant</div>
    <div id="ai-messages" class="flex-1 p-3 overflow-y-auto text-sm space-y-2"></div>
    <div class="p-2 border-t flex">
      <input type="text" id="ai-input" placeholder="ถามอะไรก็ได้..." class="flex-1 border p-1 rounded text-sm" onkeypress="if(event.key==='Enter') sendAI()">
      <button onclick="sendAI()" class="ml-2 bg-blue-600 text-white px-3 rounded text-sm">Send</button>
    </div>
  </div>

  <script>
    // === CONFIGURATION ===
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwaG7SJ5ZZZ888x0NwWLNQAN19xJgXuASJehhvMoDuNTtEYc2MMhiTfGcH8mwVthIE8Og/exec'; // ใส่ URL จาก GAS
    let currentUser = null;

    // === API CALL HELPER ===
    async function callAPI(action, data = {}) {
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          // ใช้ text/plain เพื่อหลีกเลี่ยง CORS Preflight Issues ของ GAS
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
          body: JSON.stringify({ action, data })
        });
        return await response.json();
      } catch (error) {
        console.error(error);
        return { success: false, message: 'Connection Error' };
      }
    }

    // === INITIALIZATION ===
    document.addEventListener('DOMContentLoaded', async () => {
      loadPublicDashboard();
    });

    async function loadPublicDashboard() {
      const [profs, pubs, loads] = await Promise.all([
        callAPI('getProfessors'),
        callAPI('getPublications'),
        callAPI('getTeachingLoad')
      ]);

      if (profs.success) document.getElementById('stat-profs').innerText = profs.data.length;
      if (pubs.success) {
        document.getElementById('stat-pubs').innerText = pubs.data.length;
        document.getElementById('stat-scopus').innerText = pubs.data.filter(p => p.IndexType === 'Scopus' || p.IndexType === 'ISI').length;
      }
      if (loads.success) {
        const totalCredits = loads.data.reduce((sum, item) => sum + (item.Credits || 0), 0);
        document.getElementById('stat-credits').innerText = totalCredits;
      }
      
      renderTable(profs.success ? profs.data : []);
    }

    function renderTable(data) {
      const container = document.getElementById('table-content');
      if (!data.length) { container.innerHTML = '<p class="text-gray-500">ไม่พบข้อมูล</p>'; return; }
      
      let html = '<table class="w-full text-left border-collapse"><thead class="bg-gray-100"><tr>';
      Object.keys(data[0]).forEach(key => html += `<th class="p-2 border-b">${key}</th>`);
      html += '</tr></thead><tbody>';
      data.forEach(row => {
        html += '<tr class="hover:bg-gray-50">';
        Object.values(row).forEach(val => html += `<td class="p-2 border-b">${val}</td>`);
        html += '</tr>';
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // === AUTHENTICATION ===
    function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
    function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }

    async function doLogin() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      const res = await callAPI('login', { email, password: pass });
      
      if (res.success) {
        currentUser = res.user;
        closeLoginModal();
        updateUIForRole();
      } else {
        alert(res.message);
      }
    }

    function updateUIForRole() {
      document.getElementById('auth-section').innerHTML = `
        <span class="mr-4">สวัสดี, ${currentUser.FullName} (${currentUser.Role})</span>
        <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg">ออกจากระบบ</button>
      `;
      // TODO: เพิ่มปุ่ม CRUD ตาม Role (Admin/Head/QA/Prof) ในส่วน data-table-area
    }

    function logout() {
      currentUser = null;
      location.reload();
    }

    // === AI ASSISTANT ===
    function toggleAI() {
      document.getElementById('ai-panel').classList.toggle('hidden');
    }

    async function sendAI() {
      const input = document.getElementById('ai-input');
      const msg = input.value.trim();
      if (!msg) return;

      const chatBox = document.getElementById('ai-messages');
      chatBox.innerHTML += `<div class="text-right"><span class="bg-blue-100 p-2 rounded-lg inline-block">${msg}</span></div>`;
      input.value = '';

      const res = await callAPI('aiQuery', { query: msg });
      chatBox.innerHTML += `<div class="text-left"><span class="bg-gray-100 p-2 rounded-lg inline-block">${res.reply}</span></div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
